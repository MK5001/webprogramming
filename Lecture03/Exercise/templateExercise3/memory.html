<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Memory Game</h1>
        <div id="startbutton" class="container" style="display: block;">
            <button class="btn btn-primary" onclick="startgame()">Start Game</button>
        </div>
        <div id="game-board" class="row justify-content-center" style="display: none;"></div>
        <div id="completion-message" class="text-center my-4" style="display: none;">
            <h2>Congratulations! You've matched all pairs!
                To play again, click the button below.</h2>
            <button class="btn btn-primary" onclick="restartgame()">Play Again</button>
        </div> 
    </div>
    <script>
        let flippedCards = [];
        let cardSymbols = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍒', '🍒',];
        let matchedPairs = 0;
        
        function startgame() {
            document.getElementById('startbutton').style.display = 'none';
            document.getElementById('game-board').style.display = 'flex';
            shuffle(cardSymbols);
            generateCards();
        }

        function restartgame(){
            document.getElementById('game-board').innerHTML = '';
            matchedPairs = 0;
            shuffle(cardSymbols);
            generateCards();
            document.getElementById('completion-message').style.display = 'none';
        }

        function generateCards() {
            let gameBoard = document.getElementById('game-board');
            cardSymbols.forEach(symbol => {
            let card = document.createElement('div');
            card.className = 'card';
            card.textContent = '?';
            card.onclick = () => flipCard(card);
            gameBoard.appendChild(card);
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
            card.textContent = cardSymbols[Array.from(card.parentNode.children).indexOf(card)];
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                setTimeout(checkMatch, 500);
            }
            }
        }

        function checkMatch() { 
            if (flippedCards[0].textContent === flippedCards[1].textContent) {
            flippedCards[0].classList.add('matched');
            flippedCards[1].classList.add('matched');
            matchedPairs++;
            if (matchedPairs === cardSymbols.length / 2) {
                document.getElementById('completion-message').style.display = 'block';
            }
            } else {
            flippedCards[0].textContent = '?';
            flippedCards[1].textContent = '?';
            flippedCards[0].classList.remove('flipped');
            flippedCards[1].classList.remove('flipped');
            }
            flippedCards = [];
        }
    </script>
</body>
</html>
