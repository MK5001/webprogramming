<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Memory Game</h1>
        <div id="game-board" class="row justify-content-center">
            <div class="card" onclick="flipCard(this)">?</div>
            <div class="card" onclick="flipCard(this)">?</div>
            <div class="card" onclick="flipCard(this)">?</div>
            <div class="card" onclick="flipCard(this)">?</div>
            <div class="card" onclick="flipCard(this)">?</div>
            <div class="card" onclick="flipCard(this)">?</div>
            <div class="card" onclick="flipCard(this)">?</div>
            <div class="card" onclick="flipCard(this)">?</div>
        </div>
        <div id="completion-message" class="text-center my-4" style="display: none;"> <!-- Adds a completion message wich is only shown when the game is completed(also wenn display auf block gesetzt wird) -->
            <h2>Congratulations! You've matched all pairs!
                To play again, refresh the page.
            </h2>
        </div> 
    </div>
    <script>
        let flippedCards = [];  // Array to store the flipped cards
        let cardSymbols = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍒', '🍒']; // Array mit den Symbolen
        let matchedPairs = 0;   // Variable to count the matched pairs

        function flipCard(card) {   // Function to flip the card
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) { // Überprüft ob schon 2 Karten geflippt sind und ob die Karte selbst schon geflippt ist
                card.textContent = cardSymbols[Array.from(card.parentNode.children).indexOf(card)]; // Setzt das Symbol der Karten, indem alle Karten in einem Array gespeichert werden und dann mit dem Index der Karte das Symbol aus dem Array zugeordnet wird
                // card.parentNode.children = card.game-board.allcards
                card.classList.add('flipped'); // Fügt der Karte die Klasse flipped hinzu(wichtig für zeile 35)
                flippedCards.push(card);    // Fügt die Karte zum Array flippedCards hinzu

                if (flippedCards.length === 2) { // Wenn 2 Karten geflippt sind, wird die Funktion checkMatch mit einm Delay aufgerufen
                    setTimeout(checkMatch, 500);
                }
            }
        }

        function checkMatch() { 
            if (flippedCards[0].textContent === flippedCards[1].textContent) { // Checks if the flipped cards.textContent matches
                flippedCards[0].classList.add('matched');   // Adds the class matched to the flipped cards
                flippedCards[1].classList.add('matched');
                matchedPairs++; // erhöht den Countl für matchedPairs um 1
                if (matchedPairs === cardSymbols.length / 2) { // Wenn alle Paare gefunden wurden, wird die completion message angezeigt
                    document.getElementById('completion-message').style.display = 'block';
                }
            } else { // Wenn die Karten nicht übereinstimmen, wird das Symbol wieder auf ? gesetzt und die Klasse flipped entfernt
                flippedCards[0].textContent = '?';
                flippedCards[1].textContent = '?';
                flippedCards[0].classList.remove('flipped');
                flippedCards[1].classList.remove('flipped');
            }
            flippedCards = []; // Leert die Karten aus dem Array flippedCards
        }
    </script>
</body>
</html>
